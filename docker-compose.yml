services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: csbot
      POSTGRES_PASSWORD: csbot
      POSTGRES_DB: csbot
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports: ["5432:5432"]
  redis:
    image: redis:7
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://csbot:csbot@postgres/csbot
      REDIS_URL: redis://redis:6379
    depends_on: [qdrant, postgres, redis]
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        API_BACKEND_URL: http://backend:8000
        # 直连地址必须是浏览器可访问的宿主机地址（后端已映射 8000 端口）；若设成 docker
        # 服务名 backend:8000，浏览器 JS 会解析不到而全部请求失败
        NEXT_PUBLIC_API_BASE: http://localhost:8000
        NEXT_PUBLIC_API_KEY: ${API_KEY:-dev-local-key}
    depends_on: [backend]
    ports: ["3000:3000"]

volumes:
  pgdata:
  redisdata:
