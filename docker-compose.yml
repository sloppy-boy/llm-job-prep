services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: csbot
      POSTGRES_PASSWORD: csbot
      POSTGRES_DB: csbot
    ports: ["5432:5432"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
  backend:
    build: ./backend
    env_file: ./backend/.env
    environment:
      QDRANT_URL: http://qdrant:6333
      DATABASE_URL: postgresql://csbot:csbot@postgres/csbot
      REDIS_URL: redis://redis:6379
    depends_on: [qdrant, postgres, redis]
    ports: ["8000:8000"]
  frontend:
    build:
      context: ./frontend
      args:
        API_BACKEND_URL: http://backend:8000
    depends_on: [backend]
    ports: ["3000:3000"]
